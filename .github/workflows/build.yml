name: Build and boot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and emulation tools
        run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86 gdb
      - name: Build and verify real emulated hardware
        run: make test size
      - name: Reproducible image
        run: |
          cp build/noos.img /tmp/noos-first.img
          make clean all
          cmp /tmp/noos-first.img build/noos.img
      - uses: actions/upload-artifact@v4
        with:
          name: noos-bios-image
          path: |
            build/noos.img
            build/kernel.bin
            build/kernel.lst
